default: true

# --- parameters carried over from mdl.rb ---
MD007:
  indent: 4
MD026:
  punctuation: ".,;:!"

# --- rules excluded in mdl.rb ---
MD013: false
MD014: false
MD030: false
MD032: false
MD033: false
MD041: false
MD046: false

# --- parity with mdl behavior ---
# mdl ran with --ignore-front-matter, so the front matter title never counted as a heading
MD025:
  front_matter_title: ""

# Numbered steps separated by unindented paragraphs are one list under kramdown but
# separate lists under CommonMark. Hugo (goldmark) keeps the start number when
# rendering, so these are not real breakage; checking them would require restructuring
# hundreds of task documents.
MD029: false

# --- rules that do not exist in Ruby mdl 0.12 (disabled to keep this a pure engine swap) ---
MD049: false
MD050: false
MD051: false
MD053: false
MD055: false
MD056: false
MD058: false

# kramdown scoped duplicate-heading detection to siblings; translations reuse
# section names under different parents (e.g. network models vs mesh models)
MD024:
  siblings_only: true
